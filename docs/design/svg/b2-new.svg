-review</text><text x="24" y="114" text-anchor="start" style="fill:var(--m-f2);font-size:11px;font-weight:400">Letters, digits, - and _</text><text x="24" y="148" text-anchor="start" style="fill:var(--m-f1);font-size:11px;font-weight:400">Short description (optional)</text><rect x="24" y="154" width="236" height="58" rx="2" style="fill:color-mix(in srgb, #000 4%, var(--m-l1));stroke:var(--m-b2);stroke-width:1"/><text x="32" y="171" text-anchor="start" style="fill:var(--m-f1);font-size:12px;font-weight:400">Review of the feedback runs before</text><text x="32" y="187" text-anchor="start" style="fill:var(--m-f1);font-size:12px;font-weight:400">the release of the new grader</text><text x="260" y="228" text-anchor="end" style="fill:var(--m-f2);font-size:11px;font-weight:400">64/100</text><rect x="196" y="242" width="64" height="26" rx="2" style="fill:var(--m-brand1)"/><text x="228.0" y="259" text-anchor="middle" style="fill:var(--m-inv0);font-size:12px;font-weight:600">Create</text><rect x="124.5" y="242.5" width="63" height="25" rx="2" style="fill:color-mix(in srgb, var(--m-l1) 92%, var(--m-f0));stroke:var(--m-b2);stroke-width:1"/><text x="156.0" y="259" text-anchor="middle" style="fill:var(--m-f0);font-size:12px;font-weight:400">Cancel</text><rect x="286" y="11" width="268" height="272" rx="2" style="fill:rgba(0,0,0,.25)"/><rect x="284" y="8" width="268" height="272" rx="2" style="fill:var(--m-l1);stroke:var(--m-l3);stroke-width:1"/><text x="300" y="36" text-anchor="start" style="fill:var(--m-f1);font-size:13.2px;font-weight:600">New workspace</text><text x="300" y="62" text-anchor="start" style="fill:var(--m-f1);font-size:11px;font-weight:400">Name</text><rect x="300" y="68" width="236" height="26" rx="2" style="fill:color-mix(in srgb, #000 4%, var(--m-l1));stroke:var(--m-brand1);stroke-width:1"/><text x="308" y="85" text-anchor="start" style="fill:var(--m-f1);font-size:12px;font-weight:400">auto-6</text><rect x="300" y="100" width="236" height="24" rx="0" style="fill:var(--m-l2)"/><rect x="300" y="100" width="2" height="24" rx="0" style="fill:var(--m-err)"/><text x="312" y="116" text-anchor="start" style="fill:var(--m-f1);font-size:11px;font-weight:400">A workspace named auto-6 exists</text><text x="300" y="148" text-anchor="start" style="fill:var(--m-f1);font-size:11px;font-weight:400">Short description (optional)</text><rect x="300" y="154" width="236" height="58" rx="2" style="fill:color-mix(in srgb, #000 4%, var(--m-l1));stroke:var(--m-b2);stroke-width:1"/><text x="536" y="228" text-anchor="end" style="fill:var(--m-f2);font-size:11px;font-weight:400">0/100</text><g style="opacity:0.4"><rect x="472" y="242" width="64" height="26" rx="2" style="fill:var(--m-brand1)"/><text x="504.0" y="259" text-anchor="middle" style="fill:var(--m-inv0);font-size:12px;font-weight:600">Create</text></g><rect x="400.5" y="242.5" width="63" height="25" rx="2" style="fill:color-mix(in srgb, var(--m-l1) 92%, var(--m-f0));stroke:var(--m-b2);stroke-width:1"/><text x="432.0" y="259" text-anchor="middle" style="fill:var(--m-f0);font-size:12px;font-weight:400">Cancel</text></svg>