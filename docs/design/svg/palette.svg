ospace, SFMono-Regular, Menlo, monospace">--jp-brand-color1</text><rect x="194" y="12" width="174" height="56" rx="2" style="fill:var(--m-l2)"/><rect x="194" y="12" width="4" height="56" rx="0" style="fill:var(--m-info1)"/><rect x="208" y="22" width="12" height="12" rx="2" style="fill:var(--m-info1);stroke:var(--m-l4);stroke-width:1"/><text x="228" y="33" text-anchor="start" style="fill:var(--m-f1);font-size:11px;font-weight:600">2. Cyan</text><text x="298" y="33" text-anchor="start" style="fill:var(--m-f2);font-size:11px;font-weight:400;font-family:ui-monospace, SFMono-Regular, Menlo, monospace">lavender</text><text x="208" y="56" text-anchor="start" style="fill:var(--m-f2);font-size:11px;font-weight:400;font-family:ui-monospace, SFMono-Regular, Menlo, monospace">--jp-info-color1</text><rect x="376" y="12" width="174" height="56" rx="2" style="fill:var(--m-l2)"/><rect x="376" y="12" width="4" height="56" rx="0" style="fill:var(--m-err)"/><rect x="390" y="22" width="12" height="12" rx="2" style="fill:var(--m-err);stroke:var(--m-l4);stroke-width:1"/><text x="410" y="33" text-anchor="start" style="fill:var(--m-f1);font-size:11px;font-weight:600">3. Red</text><text x="480" y="33" text-anchor="start" style="fill:var(--m-f2);font-size:11px;font-weight:400;font-family:ui-monospace, SFMono-Regular, Menlo, monospace">rose</text><text x="390" y="56" text-anchor="start" style="fill:var(--m-f2);font-size:11px;font-weight:400;font-family:ui-monospace, SFMono-Regular, Menlo, monospace">--jp-error-color1</text><rect x="12" y="78" width="174" height="56" rx="2" style="fill:var(--m-l2)"/><rect x="12" y="78" width="4" height="56" rx="0" style="fill:var(--m-warn1)"/><rect x="26" y="88" width="12" height="12" rx="2" style="fill:var(--m-warn1);stroke:var(--m-l4);stroke-width:1"/><text x="46" y="99" text-anchor="start" style="fill:var(--m-f1);font-size:11px;font-weight:600">4. Orange</text><text x="116" y="99" text-anchor="start" style="fill:var(--m-f2);font-size:11px;font-weight:400;fo