<svg xmlns="http://www.w3.org/2000/svg" width="560" height="120" viewBox="0 0 560 120" role="img" aria-label="Workspace palette in rotation order" style="font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><style>svg{--m-l0:#252b32;--m-l1:#303841;--m-l2:#404b54;--m-l3:#4d5a65;--m-f0:#e6e6e6;--m-f1:#c3c3c3;--m-f2:#7d8791;--m-b2:#404b54;--m-b3:#252b32;--m-brand1:#2196f3;--m-brand2:#64b5f6;--m-ok:#4caf50;--m-err:#f44336;--m-glyph:#bdbdbd;--m-rose:#e8bbc6;--m-peach:#ddc2a7;--m-lemon:#ccc8a6;--m-mint:#b3cdb1;--m-sky:#a5cce5;--m-lavender:#cfc1e1;--m-nb:#ef6c00;--m-md:#64b5f6;--m-py:#ffca28}@media (prefers-color-scheme: light){svg{--m-l0:#ffffff;--m-l1:#ffffff;--m-l2:#eeeeee;--m-l3:#bdbdbd;--m-f0:rgba(0,0,0,1);--m-f1:rgba(0,0,0,.87);--m-f2:rgba(0,0,0,.54);--m-b2:#e0e0e0;--m-b3:#eeeeee;--m-brand1:#1976d2;--m-brand2:#42a5f5;--m-ok:#388e3c;--m-err:#d32f2f;--m-glyph:#616161;--m-rose:#e39fb1;--m-peach:#d2ab82;--m-lemon:#bab56d;--m-mint:#87c086;--m-sky:#77bae0;--m-lavender:#bfa9da;--m-nb:#ef6c00;--m-md:#1976d2;--m-py:#f9a825}}</style><rect width="560" height="120" style="fill:var(--m-l1)"/><rect x="12" y="12" width="80" height="44" rx="2" style="fill:var(--m-l2)"/><rect x="12" y="12" width="6" height="44" rx="0" style="fill:var(--m-rose)"/><text x="26" y="30" text-anchor="start" style="fill:var(--m-f1);font-size:11px;font-weight:400">1. rose</text><text x="26" y="46" text-anchor="start" style="fill:var(--m-f2);font-size:10px;font-weight:400">strip</text><rect x="12" y="64" width="80" height="26" rx="2" style="fill:color-mix(in srgb, var(--m-rose) 22%, var(--m-l1))"/><text x="20" y="81" text-anchor="start" style="fill:var(--m-f2);font-size:10px;font-weight:400">header tint</text><rect x="102" y="12" width="80" height="44" rx="2" style="fill:var(--m-l2)"/><rect x="102" y="12" width="6" height="44" rx="0" style="fill:var(--m-peach)"/><text x="116" y="30" text-anchor="start" style="fill:var(--m-f1);font-size:11px;font-weight:400">2. peach</text><text x="1