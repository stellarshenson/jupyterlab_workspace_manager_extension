<svg xmlns="http://www.w3.org/2000/svg" width="560" height="190" viewBox="0 0 560 190" role="img" aria-label="Design B on the design system - shutdown dialog and the failed-reload banner" style="font-family:system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><style>svg{--m-l0:#252b32;--m-l1:#303841;--m-l2:#404b54;--m-l3:#4d5a65;--m-l4:#5d6d7a;--m-f0:#c3c3c3;--m-f1:#a5a5a5;--m-f2:#7d8791;--m-b2:#404b54;--m-b3:#252b32;--m-brand1:#2196f3;--m-brand2:#64b5f6;--m-ok:#4caf50;--m-err:#f44336;--m-glyph:#bdbdbd;--m-rose:#e8bbc6;--m-peach:#ddc2a7;--m-lemon:#ccc8a6;--m-mint:#b3cdb1;--m-sky:#a5cce5;--m-lavender:#cfc1e1;--m-nb:#ef6c00;--m-md:#64b5f6;--m-py:#ffca28;--m-b1:#404b54;--m-warn1:#ff9800;--m-warn2:#ffb74d;--m-info1:#00bcd4;--m-inv0:#1e2124}@media (prefers-color-scheme: light){svg{--m-l0:#ffffff;--m-l1:#ffffff;--m-l2:#eeeeee;--m-l3:#bdbdbd;--m-l4:#757575;--m-f0:rgba(0,0,0,1);--m-f1:rgba(0,0,0,.87);--m-f2:rgba(0,0,0,.54);--m-b2:#e0e0e0;--m-b3:#eeeeee;--m-brand1:#1976d2;--m-brand2:#42a5f5;--m-ok:#388e3c;--m-err:#d32f2f;--m-glyph:#616161;--m-rose:#e39fb1;--m-peach:#d2ab82;--m-lemon:#bab56d;--m-mint:#87c086;--m-sky:#77bae0;--m-lavender:#bfa9da;--m-nb:#ef6c00;--m-md:#1976d2;--m-py:#f9a825;--m-b1:#bdbdbd;--m-warn1:#f57c00;--m-warn2:#ffb74d;--m-info1:#0097a7;--m-inv0:#ffffff}}</style><rect width="560" height="190" style="fill:var(--m-l1)"/><rect x="10" y="11" width="268" height="150" rx="2" style="fill:rgba(0,0,0,.25)"/><rect x="8" y="8" width="268" height="150" rx="2" style="fill:var(--m-l1);stroke:var(--m-l3);stroke-width:1"/><text x="24" y="36" text-anchor="start" style="fill:var(--m-f1);font-size:13.2px;font-weight:600">Shut down terminal 7?</text><text x="24" y="66" text-anchor="start" style="fill:var(--m-f1);font-size:11px;font-weight:400">Workspace auto-6 also holds this terminal.</text><rect x="24.5" y="118.5" width="83" height="25" rx="2" style="fill:none;stroke:color-mix(in srgb, var(--m-err) 60%, var(--m-b2));stroke-width:1"/><text x="66.0" y="135" text-anchor="middle" style="fill:var(--m-err);font-size:12px;font-weight:400">Shut down</text><rect x="196.5" y="118.5" width="63" height="25" rx="2" style="fill:color-mix(in srgb, var(--m-l1) 92%, var(--m-f0));stroke:var(--m-b2);stroke-width:1"/><text x="228.0" y="135" text-anchor="middle" style="fill:var(--m-f0);font-size:12px;font-weight:400">Cancel</text><rect x="288" y="8" width="264" height="174" rx="0" style="fill:var(--m-l1)"/><rect x="288" y="8" width="264" height="28" rx="0" style="fill:var(--m-l2)"/><text x="306" y="25.5" text-anchor="start" style="fill:var(--m-f1);font-size:9.2px;font-weight:600;letter-spacing:1px">WORKBENCH</text><rect x="296" y="42" width="248" height="26" rx="2" style="fill:color-mix(in srgb, var(--m-err) 15%, transparent);stroke:color-mix(in srgb, var(--m-err) 35%, transparent);stroke-width:1"/><text x="304" y="59" text-anchor="start" style="fill:var(--m-f1);font-size:11px;font-weight:400">Reload failed: terminals answered 500</text><line x1="288" y1="76.5" x2="552" y2="76.5" style="stroke:var(--m-b3);stroke-width:1"/><rect x="288" y="77" width="264" height="24" rx="0" style="fill:var(--m-l2)"/><polygon points="294,86 302,86 298,91" style="fill:var(--m-f2)"/><text x="306" y="92.5" text-anchor="start" style="fill:var(--m-f1);font-size:9.2px;font-weight:600;letter-spacing:1px">WORKSPACES</text><text x="392" y="92.5" text-anchor="start" style="fill:var(--m-f2);font-size:9.2px;font-weight:400">(6)</text><text x="304" y="132" text-anchor="start" style="fill:var(--m-f2);font-size:11px;font-weight:400">The last content stays under the banner</text></svg>